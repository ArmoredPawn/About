<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <iframe class="game-frame" id="game" src="games/riptide-strike/" title="Riptide Strike — Speedboat Combat Racing"

    // An invite link (?room=CODE) opens the game with the code filled in
    const room = new URLSearchParams(location.search).get('room');

  </script>
